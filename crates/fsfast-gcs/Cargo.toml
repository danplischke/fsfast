[package]
name = "fsfast-gcs"
description = "gcsfs-compatible Google Cloud Storage filesystem for fsfast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fsfast-core.workspace = true
fsfast-engine.workspace = true
fsfast-http-transport.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true
# JSON API resources, credential files, token responses.
serde_json = "1"
base64 = "0.23"
# RS256 (RSASSA-PKCS1-v1_5 with SHA-256) for service-account JWTs and V4
# signed URLs, and the CSPRNG for upload boundaries / idempotency tokens:
# the aws-lc-rs build rustls already uses (same features, no second copy).
aws-lc-rs = { version = "1.19", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
# Canonical-request hash of V4 signed URLs; MD5 for consistency="md5".
sha2 = "0.11"
md-5 = "0.11"
hex = "0.4"
percent-encoding = "2.3"
# Hardware-accelerated CRC32C (SSE4.2 / ARMv8 CRC) with combine, for
# verifying downloads against X-Goog-Hash and consistency="crc32c".
crc32c = "0.6"
# Secrets (private keys, refresh tokens, access tokens) are wiped on drop.
zeroize = "1"

[dev-dependencies]
fsfast-testkit.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
proptest = "1.5"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
