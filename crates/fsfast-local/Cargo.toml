[package]
name = "fsfast-local"
description = "Local-disk fsfast filesystem with fsspec LocalFileSystem semantics"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fsfast-core.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# utimensat(UTIME_NOW): `touch` must update timestamps with the permission
# rules of os.utime(path, None) (write access suffices), which std's
# File::set_times (explicit times, owner only) cannot express.
rustix = { version = "1", default-features = false, features = ["std", "fs"] }

[dev-dependencies]
fsfast-testkit.workspace = true
proptest = "1.5"
tempfile = "3"
tokio = { workspace = true }
