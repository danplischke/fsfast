[package]
name = "fsfast-smb"
description = "fsspec-compatible SMB 2/3 filesystem for fsfast: pipelined, compounding SMB client on fsfast-smb-proto"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fsfast-core.workspace = true
fsfast-engine.workspace = true
fsfast-smb-proto.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
parking_lot.workspace = true
tokio.workspace = true
tracing.workspace = true
# AES block function for peeking at GCM-encrypted READ headers (src/peek.rs);
# already in the tree through fsfast-smb-proto.
aes = "0.9"

[dev-dependencies]
fsfast-testkit.workspace = true
proptest = "1.5"
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
