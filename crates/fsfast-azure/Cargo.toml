[package]
name = "fsfast-azure"
description = "adlfs-compatible Azure Blob Storage filesystem for fsfast"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
fsfast-core.workspace = true
fsfast-engine.workspace = true
fsfast-http-transport.workspace = true
async-trait.workspace = true
bytes.workspace = true
futures.workspace = true
parking_lot.workspace = true
# `process` runs `az account get-access-token` without blocking the runtime.
tokio = { workspace = true, features = ["process"] }
tracing.workspace = true
# Shared Key / SAS signatures (HMAC-SHA256) and Content-MD5 decoding: the
# RustCrypto versions the other backends already build.
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
httpdate = "1"
# Entra ID token responses and the Azure CLI's JSON output.
serde_json = "1"
# Account keys and access tokens are wiped from memory when dropped.
zeroize = "1"

[dev-dependencies]
fsfast-testkit.workspace = true
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
proptest = "1.5"
tempfile = "3"
tokio = { workspace = true, features = ["test-util", "process"] }
