[package]
name = "fsfast-py"
description = "PyO3 extension module `fsfast._core`: the Rust side of fsfast's fsspec-compatible Python classes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "_core"
# `cdylib` is the Python extension; `rlib` lets the unit tests link the crate.
crate-type = ["cdylib", "rlib"]

[features]
# One feature per compiled-in backend. Adding a backend is one line here plus
# one match arm in `src/registry.rs`.
default = ["local", "memory", "http", "s3", "smb", "sftp", "gcs", "azure"]
local = ["dep:fsfast-local"]
memory = ["dep:fsfast-memory"]
http = ["dep:fsfast-http"]
s3 = ["dep:fsfast-s3"]
smb = ["dep:fsfast-smb"]
sftp = ["dep:fsfast-sftp"]
gcs = ["dep:fsfast-gcs"]
azure = ["dep:fsfast-azure"]
# Set by maturin (see the root pyproject.toml): do not link libpython into the
# extension module. Left off for `cargo test`, which embeds an interpreter.
extension-module = ["pyo3/extension-module"]

[dependencies]
fsfast-core.workspace = true
fsfast-engine.workspace = true
fsfast-local = { workspace = true, optional = true }
fsfast-memory = { workspace = true, optional = true }
fsfast-http = { workspace = true, optional = true }
fsfast-s3 = { workspace = true, optional = true }
fsfast-smb = { workspace = true, optional = true }
fsfast-sftp = { workspace = true, optional = true }
fsfast-gcs = { workspace = true, optional = true }
fsfast-azure = { workspace = true, optional = true }
arc-swap = "1"
bytes.workspace = true
futures.workspace = true
memchr = "2"
parking_lot.workspace = true
pyo3 = { version = "0.30", features = ["abi3-py310"] }
pyo3-async-runtimes = { version = "0.30", features = ["tokio-runtime"] }
tokio.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
# `pthread_atfork`: count forks without a `getpid` call per operation.
libc = "0.2"

[dev-dependencies]
pyo3 = { version = "0.30", features = ["abi3-py310", "auto-initialize"] }
tokio = { workspace = true, features = ["test-util"] }
